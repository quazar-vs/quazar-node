[package]
name = "coinex_martingale_bot"
version = "0.1.0"
edition = "2021"
description = "CoinEx futures martingale trading bot (hedge BUY+SELL with TP/SL)"

[dependencies]
anyhow = "1"
dotenv = "0.15"
flate2 = "1"
futures-util = "0.3"
hex = "0.4"
hmac = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
