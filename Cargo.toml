[package]
name = "quazar_registry"
version = "0.7.0"
edition = "2021"
publish = false

[[bin]]
name = "quazar_registry"
path = "src/main.rs"

[[bin]]
name = "quazar_crypto_agent"
path = "src/bin/crypto_agent.rs"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "chrono", "uuid", "json", "migrate", "derive", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tower = { version = "0.4", features = ["limit"] }
tower-http = { version = "0.7", features = ["auth", "limit", "trace", "cors", "compression-gzip"] }
uuid = { version = "1", features = ["v4", "serde"] }
dotenvy = "0.15"
governor = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
ssh-key = { version = "0.6", default-features = false, features = ["alloc", "ed25519", "getrandom"] }
rand_core = "0.6"
rand = "0.8"
hex = "0.4"
zstd = "0.13"
bcrypt = "0.16"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "native-tls"] }
# Prefer maintained spin; flume still pins spin 0.9 transitively (audit note if needed).
spin = "0.12"
