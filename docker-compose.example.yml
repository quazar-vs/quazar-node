# Example 2-node stack. Copy to docker-compose.yml and fill .env — no secrets inlined.
# Required in .env: POSTGRES_PASSWORD, QUAZAR_NODE_SECRET, QUAZAR_REG_SECRET, ADMIN_API_KEY

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: quazar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: quazar
    volumes:
      - quazar_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quazar -d quazar"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-2:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: quazar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: quazar
    volumes:
      - quazar_pg_data_2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quazar -d quazar"]
      interval: 5s
      timeout: 5s
      retries: 5

  quazar-node:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DATABASE_URL: postgres://quazar:${POSTGRES_PASSWORD}@postgres:5432/quazar
      QUAZAR_NODE_SECRET: ${QUAZAR_NODE_SECRET:?QUAZAR_NODE_SECRET must be set}
      QUAZAR_REG_SECRET: ${QUAZAR_REG_SECRET:?QUAZAR_REG_SECRET must be set}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?ADMIN_API_KEY must be set}
      QUAZAR_STRICT_SECRETS: ${QUAZAR_STRICT_SECRETS:-false}
      RECAPTCHA_SITE_KEY: ${RECAPTCHA_SITE_KEY:-}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY:-}
      QUAZAR_TRUSTED_PROXIES: ${QUAZAR_TRUSTED_PROXIES:-}
      QUAZAR_INIT_TEST_KEYS: ${QUAZAR_INIT_TEST_KEYS:-false}
      QUAZAR_NODE_ID: QZ-NODE-1
      QUAZAR_NODE_URL: http://quazar-node:8080
      PASSPORT_DOWNLOAD_URL: ${PASSPORT_DOWNLOAD_URL:-https://github.com/quazar-vs/quazar-passport/releases}
      QUAZAR_PORT: "8080"
      QUAZAR_SYNC_INTERVAL_SECS: "60"
      QUAZAR_CORS_ORIGINS: ${QUAZAR_CORS_ORIGINS:-https://quazar.website}
      QUAZAR_BOOTSTRAP_PEERS: QZ-NODE-2@http://quazar-node-2:8080
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Квазар}
      SMTP_TLS_INSECURE: ${SMTP_TLS_INSECURE:-false}
      NOTIFY_EMAIL: ${NOTIFY_EMAIL:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/status"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  quazar-node-2:
    build: .
    ports:
      - "8081:8080"
    environment:
      DATABASE_URL: postgres://quazar:${POSTGRES_PASSWORD}@postgres-2:5432/quazar
      QUAZAR_NODE_SECRET: ${QUAZAR_NODE_SECRET:?QUAZAR_NODE_SECRET must be set}
      QUAZAR_REG_SECRET: ${QUAZAR_REG_SECRET:?QUAZAR_REG_SECRET must be set}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?ADMIN_API_KEY must be set}
      QUAZAR_STRICT_SECRETS: ${QUAZAR_STRICT_SECRETS:-false}
      RECAPTCHA_SITE_KEY: ${RECAPTCHA_SITE_KEY:-}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY:-}
      QUAZAR_TRUSTED_PROXIES: ${QUAZAR_TRUSTED_PROXIES:-}
      QUAZAR_INIT_TEST_KEYS: ${QUAZAR_INIT_TEST_KEYS:-false}
      QUAZAR_NODE_ID: QZ-NODE-2
      QUAZAR_NODE_URL: http://quazar-node-2:8080
      PASSPORT_DOWNLOAD_URL: ${PASSPORT_DOWNLOAD_URL:-https://github.com/quazar-vs/quazar-passport/releases}
      QUAZAR_PORT: "8080"
      QUAZAR_SYNC_INTERVAL_SECS: "60"
      QUAZAR_CORS_ORIGINS: ${QUAZAR_CORS_ORIGINS:-https://quazar.website}
      QUAZAR_BOOTSTRAP_PEERS: QZ-NODE-1@http://quazar-node:8080
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Квазар}
      SMTP_TLS_INSECURE: ${SMTP_TLS_INSECURE:-false}
      NOTIFY_EMAIL: ${NOTIFY_EMAIL:-}
    depends_on:
      postgres-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/status"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  quazar_pg_data:
  quazar_pg_data_2:
