name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: quazar
          POSTGRES_PASSWORD: quazar
          POSTGRES_DB: quazar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quazar -d quazar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://quazar:quazar@localhost:5432/quazar
      QUAZAR_NODE_SECRET: QUAZAR_NODE_SECRET_CI
      QUAZAR_REG_SECRET: QUAZAR_REG_SECRET_CI
      QUAZAR_INIT_TEST_KEYS: "false"
      QUAZAR_PORT: "8080"

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit and cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny

      - name: cargo check
        run: cargo check --locked

      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo audit
        run: cargo audit

      - name: cargo deny check
        run: cargo deny check

      - name: cargo build
        run: cargo build --locked

      - name: cargo test
        run: cargo test --locked

      - name: smoke test
        run: bash scripts/smoke.sh
        env:
          QUAZAR_INIT_TEST_KEYS: "true"
