# Quazar chat-direct: secrets and models without Hermes
[Service]
Environment=QUAZAR_API_KEY_FILE=/var/lib/quazar/secrets/quazar-secretary-api-key
Environment=OPENROUTER_KEY_FILE=/var/lib/quazar/secrets/openrouter-api-key
Environment=QUAZAR_CHAT_CONFIG=/var/lib/quazar/config/chat-models.yaml
Environment=QUAZAR_CHAT_SEND=/usr/local/bin/quazar-chat-send
Environment=QUAZAR_API_BASE=http://127.0.0.1:8080
Environment=QUAZAR_LEGACY_HERMES_LIB=/root/.hermes/lib
