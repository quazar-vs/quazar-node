# Quazar production compose (default = core: postgres + quazar-node).
#
# Architecture (additive, no forced cutover):
#   Core install:     docker compose -f compose.core.yml up -d
#                     or: docker compose up -d   (this file)
#   External agents:  docker compose -f deploy/external-agents/docker-compose.yml up -d --build
#                     or: docker compose -f docker-compose.yml -f compose.external-agents.yml --profile external up -d --build
#   Canon:            docs/architecture-agents-containers.md
#
# Shared Docker DNS name for future in-network Secretary → external agents:
#   network `quazar` (+ label `quazar-external` on the external contour).
# Host Secretary today: SVYAZNOY_URL / CURSOR_AGENT_URL → http://127.0.0.1:8090

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quazar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: quazar
    volumes:
      - quazar_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d quazar"]
      interval: 5s
      timeout: 5s
      retries: 5

  quazar-node:
    build: .
    restart: always
    ports:
      - "127.0.0.1:8080:8080"
      - "8443:8443/udp"
    volumes:
      - /var/lib/quazar/algonism:/var/lib/quazar/algonism
      - /var/lib/quazar/ss:/var/lib/quazar/ss
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      QUAZAR_NODE_SECRET: ${QUAZAR_NODE_SECRET:?QUAZAR_NODE_SECRET must be set}
      QUAZAR_REG_SECRET: ${QUAZAR_REG_SECRET:?QUAZAR_REG_SECRET must be set}
      QUAZAR_STRICT_SECRETS: ${QUAZAR_STRICT_SECRETS:-true}
      RECAPTCHA_SITE_KEY: ${RECAPTCHA_SITE_KEY:-}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY:-}
      QUAZAR_TRUSTED_PROXIES: ${QUAZAR_TRUSTED_PROXIES:-}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?ADMIN_API_KEY must be set}
      QUAZAR_INIT_TEST_KEYS: ${QUAZAR_INIT_TEST_KEYS:-false}
      QUAZAR_NODE_ID: ${QUAZAR_NODE_ID:-QZ-NODE-1}
      QUAZAR_NODE_URL: ${QUAZAR_NODE_URL:-http://quazar-node:8080}
      PASSPORT_DOWNLOAD_URL: ${PASSPORT_DOWNLOAD_URL:-https://github.com/quazar-vs/quazar-passport/releases}
      QUAZAR_PORT: ${QUAZAR_PORT:-8080}
      QUAZAR_SYNC_INTERVAL_SECS: ${QUAZAR_SYNC_INTERVAL_SECS:-60}
      EXCHANGE_DEFAULT_SHELF_LIFE_SECS: ${EXCHANGE_DEFAULT_SHELF_LIFE_SECS:-2592000}
      QUAZAR_CORS_ORIGINS: ${QUAZAR_CORS_ORIGINS:-https://quazar.website}
      QUAZAR_NETWORK_URL: ${QUAZAR_NETWORK_URL:-}
      QUAZAR_BOOTSTRAP_PEERS: ${QUAZAR_BOOTSTRAP_PEERS:-}
      QUAZAR_QUIC_PORT: ${QUAZAR_QUIC_PORT:-8443}
      QUAZAR_QUIC_ADVERTISE: ${QUAZAR_QUIC_ADVERTISE:-}
      QUAZAR_PUBLIC_URL: ${QUAZAR_PUBLIC_URL:-}
      RUST_LOG: ${RUST_LOG:-info}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Квазар}
      SMTP_TLS_INSECURE: ${SMTP_TLS_INSECURE:-false}
      NOTIFY_EMAIL: ${NOTIFY_EMAIL:-}
      GMAIL_USER: ${GMAIL_USER:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      GMAIL_FROM_NAME: ${GMAIL_FROM_NAME:-}
      # Shadowsocks citizen VPN (ssserver on host; node writes /var/lib/quazar/ss/config.json)
      SS_ENABLED: ${SS_ENABLED:-true}
      SS_PORT: ${SS_PORT:-8388}
      SS_METHOD: ${SS_METHOD:-chacha20-ietf-poly1305}
      SS_TTL_HOURS: ${SS_TTL_HOURS:-24}
      SS_PUBLIC_HOST: ${SS_PUBLIC_HOST:-quazar.website}
      SS_CONFIG_DIR: ${SS_CONFIG_DIR:-/var/lib/quazar/ss}
      # Legacy SSH tunnel VPN removed from kernel (Passport uses SS only).
      VPN_KEY_TTL_HOURS: ${VPN_KEY_TTL_HOURS:-24}
      SVOD_VIDEO_CREATE_REWARD: ${SVOD_VIDEO_CREATE_REWARD:-50}
      SVOD_VIDEO_VIEW_REWARD: ${SVOD_VIDEO_VIEW_REWARD:-10}
      # Optional private DNA (set GITHUB_TOKEN in .env when algonism-core is private)
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      QUAZAR_ALGONISM_CACHE_PATH: /var/lib/quazar/algonism/ALGONISM.md
      # Seed SVOD.md until published on quazar-law (loaded into laws.svod).
      QUAZAR_SVOD_SEED_PATH: ${QUAZAR_SVOD_SEED_PATH:-/var/lib/quazar/algonism/SVOD.md}
      # Poll GitHub DNA/laws/SVOD into node cache (60–300s). Never go over P2P.
      QUAZAR_ALGONISM_POLL_SECS: ${QUAZAR_ALGONISM_POLL_SECS:-120}
      # Optional HTTP stubs for external agents (Secretary / future in-core callers).
      # Empty = unchanged host CLI path (algonism-svyaznoy / quazar-cursor-direct).
      SVYAZNOY_URL: ${SVYAZNOY_URL:-}
      CURSOR_AGENT_URL: ${CURSOR_AGENT_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/status"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  crypto-agent:
    build: .
    profiles: ["crypto-agent"]
    restart: unless-stopped
    command: ["/app/quazar_crypto_agent"]
    environment:
      CRYPTO_AGENT_EXCHANGE: ${CRYPTO_AGENT_EXCHANGE:-binance}
      CRYPTO_AGENT_SYMBOLS: ${CRYPTO_AGENT_SYMBOLS:-BTCUSDT,ETHUSDT}
      CRYPTO_AGENT_INTERVAL_SECS: ${CRYPTO_AGENT_INTERVAL_SECS:-30}
      CRYPTO_AGENT_ALERT_PCT: ${CRYPTO_AGENT_ALERT_PCT:-2.0}
      RUST_LOG: ${CRYPTO_AGENT_RUST_LOG:-info}

  hermes:
    # Deprecated: citizen chat uses quazar-chat-direct → OpenRouter.
    # YouTube helpers run on host via /var/lib/quazar/venv-youtube.
    # Enable only for legacy debugging: docker compose --profile hermes up -d hermes
    profiles: ["hermes"]
    image: nousresearch/hermes-agent:latest
    container_name: hermes-gateway
    env_file:
      - /root/.hermes/secrets/quazar-secretary.env
    restart: unless-stopped
    command: gateway run
    ports:
      - "127.0.0.1:8642:8642"
    environment:
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_KEY: ${HERMES_API_KEY:-}
      HERMES_LOG_LEVEL: info
      HERMES_YOLO_MODE: "1"
    volumes:
      - /root/.hermes:/opt/data
      - /opt/quazar:/opt/quazar:ro
      - /var/www/quazar:/var/www/quazar:ro
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"

volumes:
  quazar_pg_data:

# Declared for overlays (`compose.external-agents.yml`) and compose.core.yml.
# Default services still use the project `default` network so a routine
# `docker compose up` does not recreate prod onto a new bridge.
networks:
  quazar:
    name: quazar
  quazar-external:
    name: quazar-external
