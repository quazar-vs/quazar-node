services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quazar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: quazar
    volumes:
      - quazar_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d quazar"]
      interval: 5s
      timeout: 5s
      retries: 5

  quazar-node:
    build: .
    restart: always
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /var/lib/quazar/tunnel:/var/lib/quazar/tunnel
      - /var/lib/quazar/algonism:/var/lib/quazar/algonism
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      QUAZAR_NODE_SECRET: ${QUAZAR_NODE_SECRET:?QUAZAR_NODE_SECRET must be set}
      QUAZAR_REG_SECRET: ${QUAZAR_REG_SECRET:?QUAZAR_REG_SECRET must be set}
      QUAZAR_STRICT_SECRETS: ${QUAZAR_STRICT_SECRETS:-true}
      RECAPTCHA_SITE_KEY: ${RECAPTCHA_SITE_KEY:-}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY:-}
      QUAZAR_TRUSTED_PROXIES: ${QUAZAR_TRUSTED_PROXIES:-}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?ADMIN_API_KEY must be set}
      QUAZAR_INIT_TEST_KEYS: ${QUAZAR_INIT_TEST_KEYS:-false}
      QUAZAR_NODE_ID: ${QUAZAR_NODE_ID:-QZ-NODE-1}
      QUAZAR_NODE_URL: ${QUAZAR_NODE_URL:-http://quazar-node:8080}
      PASSPORT_DOWNLOAD_URL: ${PASSPORT_DOWNLOAD_URL:-https://github.com/quazar-vs/quazar-passport/releases}
      QUAZAR_PORT: ${QUAZAR_PORT:-8080}
      QUAZAR_SYNC_INTERVAL_SECS: ${QUAZAR_SYNC_INTERVAL_SECS:-60}
      QUAZAR_CORS_ORIGINS: ${QUAZAR_CORS_ORIGINS:-https://quazar.website}
      QUAZAR_NETWORK_URL: ${QUAZAR_NETWORK_URL:-}
      QUAZAR_BOOTSTRAP_PEERS: ${QUAZAR_BOOTSTRAP_PEERS:-}
      RUST_LOG: ${RUST_LOG:-info}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Квазар}
      SMTP_TLS_INSECURE: ${SMTP_TLS_INSECURE:-false}
      NOTIFY_EMAIL: ${NOTIFY_EMAIL:-}
      GMAIL_USER: ${GMAIL_USER:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      GMAIL_FROM_NAME: ${GMAIL_FROM_NAME:-}
      SSH_TUNNEL_ENABLED: ${SSH_TUNNEL_ENABLED:-false}
      SSH_GATEWAY_PORTS: ${SSH_GATEWAY_PORTS:-yes}
      SSH_KEEPALIVE_INTERVAL: ${SSH_KEEPALIVE_INTERVAL:-60}
      SSH_KEEPALIVE_COUNT_MAX: ${SSH_KEEPALIVE_COUNT_MAX:-3}
      VPN_KEY_TTL_HOURS: ${VPN_KEY_TTL_HOURS:-24}
      SSH_TUNNEL_USER: ${SSH_TUNNEL_USER:-quazar-tunnel}
      SSH_TUNNEL_HOST: ${SSH_TUNNEL_HOST:-}
      SSH_TUNNEL_PORT: ${SSH_TUNNEL_PORT:-22}
      SSH_TUNNEL_CLIENT_LOCAL_PORT: ${SSH_TUNNEL_CLIENT_LOCAL_PORT:-18443}
      SSH_TUNNEL_REMOTE_API_HOST: ${SSH_TUNNEL_REMOTE_API_HOST:-127.0.0.1}
      SSH_TUNNEL_REMOTE_API_PORT: ${SSH_TUNNEL_REMOTE_API_PORT:-8080}
      VPN_AUTHORIZED_KEYS_PATH: ${VPN_AUTHORIZED_KEYS_PATH:-}
      SVOD_VIDEO_CREATE_REWARD: ${SVOD_VIDEO_CREATE_REWARD:-50}
      SVOD_VIDEO_VIEW_REWARD: ${SVOD_VIDEO_VIEW_REWARD:-10}
      # Optional private DNA (set GITHUB_TOKEN in .env when algonism-core is private)
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      QUAZAR_ALGONISM_CACHE_PATH: /var/lib/quazar/algonism/ALGONISM.md
      # Poll GitHub DNA/laws into node cache (60–300s). DNA/laws never go over P2P.
      QUAZAR_ALGONISM_POLL_SECS: ${QUAZAR_ALGONISM_POLL_SECS:-120}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/status"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  crypto-agent:
    build: .
    profiles: ["crypto-agent"]
    restart: unless-stopped
    command: ["/app/quazar_crypto_agent"]
    environment:
      CRYPTO_AGENT_EXCHANGE: ${CRYPTO_AGENT_EXCHANGE:-binance}
      CRYPTO_AGENT_SYMBOLS: ${CRYPTO_AGENT_SYMBOLS:-BTCUSDT,ETHUSDT}
      CRYPTO_AGENT_INTERVAL_SECS: ${CRYPTO_AGENT_INTERVAL_SECS:-30}
      CRYPTO_AGENT_ALERT_PCT: ${CRYPTO_AGENT_ALERT_PCT:-2.0}
      RUST_LOG: ${CRYPTO_AGENT_RUST_LOG:-info}

  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hermes-gateway
    env_file:
      - /root/.hermes/secrets/quazar-secretary.env
    restart: unless-stopped
    command: gateway run
    ports:
      - "127.0.0.1:8642:8642"
    environment:
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_KEY: ${HERMES_API_KEY:?HERMES_API_KEY must be set}
      HERMES_LOG_LEVEL: info
      HERMES_YOLO_MODE: "1"
      # Auto-approve dangerous tools for Secretary automation (hardline deny still applies)
    volumes:
      - /root/.hermes:/opt/data
      - /opt/quazar:/opt/quazar:ro
      - /var/www/quazar:/var/www/quazar:ro
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"

volumes:
  quazar_pg_data:
