version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: quazar
      POSTGRES_PASSWORD: quazar
      POSTGRES_DB: quazar
    volumes:
      - quazar_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quazar -d quazar"]
      interval: 5s
      timeout: 5s
      retries: 5

  quazar-node:
    build: .
    restart: always
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://quazar:quazar@postgres:5432/quazar
      QUAZAR_NODE_SECRET: quazar_node_secret_2026
      QUAZAR_REG_SECRET: quazar_reg_secret_2026
      QUAZAR_INIT_TEST_KEYS: "false"
      QUAZAR_NODE_ID: QZ-NODE-1
      QUAZAR_NODE_URL: http://quazar-node:8080
      QUAZAR_PORT: "8080"
      QUAZAR_SYNC_INTERVAL_SECS: "60"
      QUAZAR_CORS_ORIGINS: "https://quazar.website"
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/status"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  quazar_pg_data:
