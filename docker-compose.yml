version: '3.8'

# Secrets must come from .env (see .env.example). No weak inlined defaults.
services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quazar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: quazar
    volumes:
      - quazar_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d quazar"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Lightweight Postfix + Dovecot (replaces docker-mailserver)
  mailserver:
    build: ./mail
    image: quazar-mail:local
    hostname: mail.quazar.website
    domainname: quazar.website
    restart: always
    stop_grace_period: 30s
    ports:
      - "25:25"
      - "143:143"
      - "465:465"
      - "587:587"
      - "993:993"
    environment:
      MAIL_DOMAIN: ${MAIL_DOMAIN:-quazar.website}
      MAIL_HOSTNAME: ${MAIL_HOSTNAME:-mail.quazar.website}
      POSTMASTER: ${MAIL_FROM:-no-reply@quazar.website}
      SEED_MAIL_PASSWORD: ${SMTP_PASSWORD:-}
    volumes:
      - quazar_mail_data:/var/mail/vhosts
      - quazar_mail_users:/etc/dovecot/users
      - quazar_mail_maps:/etc/postfix/maps
      - quazar_mail_ssl:/etc/ssl/mail
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 25 && nc -z 127.0.0.1 587"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s

  quazar-node:
    build: .
    restart: always
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      # MAIL_AUTO_CREATE: docker exec into mailserver
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      QUAZAR_NODE_SECRET: ${QUAZAR_NODE_SECRET:?QUAZAR_NODE_SECRET must be set}
      QUAZAR_REG_SECRET: ${QUAZAR_REG_SECRET:?QUAZAR_REG_SECRET must be set}
      QUAZAR_STRICT_SECRETS: ${QUAZAR_STRICT_SECRETS:-true}
      RECAPTCHA_SITE_KEY: ${RECAPTCHA_SITE_KEY:-}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY:-}
      QUAZAR_TRUSTED_PROXIES: ${QUAZAR_TRUSTED_PROXIES:-}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?ADMIN_API_KEY must be set}
      QUAZAR_INIT_TEST_KEYS: ${QUAZAR_INIT_TEST_KEYS:-false}
      QUAZAR_NODE_ID: ${QUAZAR_NODE_ID:-QZ-NODE-1}
      QUAZAR_NODE_URL: ${QUAZAR_NODE_URL:-http://quazar-node:8080}
      QUAZAR_PORT: ${QUAZAR_PORT:-8080}
      QUAZAR_SYNC_INTERVAL_SECS: ${QUAZAR_SYNC_INTERVAL_SECS:-60}
      QUAZAR_CORS_ORIGINS: ${QUAZAR_CORS_ORIGINS:-https://quazar.website}
      QUAZAR_NETWORK_URL: ${QUAZAR_NETWORK_URL:-}
      QUAZAR_BOOTSTRAP_PEERS: ${QUAZAR_BOOTSTRAP_PEERS:-}
      RUST_LOG: ${RUST_LOG:-info}
      SMTP_HOST: ${SMTP_HOST:-mailserver}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Квазар}
      SMTP_TLS_INSECURE: ${SMTP_TLS_INSECURE:-true}
      GMAIL_USER: ${GMAIL_USER:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      GMAIL_FROM_NAME: ${GMAIL_FROM_NAME:-}
      MAIL_AUTO_CREATE: ${MAIL_AUTO_CREATE:-true}
      MAIL_DOMAIN: ${MAIL_DOMAIN:-quazar.website}
      MAIL_FROM: ${MAIL_FROM:-no-reply@quazar.website}
      MAIL_CONTAINER: ${MAIL_CONTAINER:-quazar-mailserver-1}
    depends_on:
      postgres:
        condition: service_healthy
      mailserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/status"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  quazar_pg_data:
  quazar_mail_data:
  quazar_mail_users:
  quazar_mail_maps:
  quazar_mail_ssl:
