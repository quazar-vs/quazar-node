<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Перенаправление — заявки Квазар</title>
  <script>
    (function () {
      var raw = (location.hash || "#apply").replace(/^#/, "");
      var parts = raw.split("/").filter(Boolean);
      var target = "/#apply";
      if (parts[0] === "verify" && parts[1]) {
        // Verify step removed — open status instead
        target = "/#apply/status/" + encodeURIComponent(decodeURIComponent(parts[1]));
      } else if (parts[0] === "status" && parts[1]) {
        target = "/#apply/status/" + encodeURIComponent(decodeURIComponent(parts[1]));
      } else if (parts[0] === "admin") {
        target = "/#apply/admin";
      } else if (parts[0] === "apply" || !parts.length) {
        target = "/#apply";
      }
      location.replace(target);
    })();
  </script>
  <meta http-equiv="refresh" content="0;url=/#apply">
</head>
<body>
  <p>Форма заявок перенесена на главную. <a href="/#apply">Перейти к подаче заявки</a>.</p>
</body>
</html>
