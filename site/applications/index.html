<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Портал заявок — Квазар</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;550;650&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-display: "Fraunces", Georgia, serif;
      --font-body: "Source Sans 3", "Segoe UI", sans-serif;

      --bg: #0d1219;
      --bg-elevated: #151c27;
      --ink: #e8e6e1;
      --muted: #9aa3b5;
      --line: rgba(232, 230, 225, 0.12);

      --accent: #d4a27f;
      --accent-ink: #1a120c;

      --ok: #5dba90;
      --warn: #e0b35a;
      --bad: #e07a7a;
      --pending: #7eaddc;

      --radius: 14px;
      --shadow: 0 1px 0 rgba(0,0,0,0.12);
      --glow: radial-gradient(1000px 480px at 0% -20%, rgba(212, 162, 127, 0.16), transparent 50%),
              radial-gradient(800px 420px at 100% 0%, rgba(85, 120, 170, 0.14), transparent 45%),
              linear-gradient(180deg, #101722 0%, #0b1017 100%);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: var(--font-body);
      color: var(--ink);
      background: var(--glow);
      background-color: var(--bg);
      line-height: 1.5;
    }

    .shell {
      width: min(980px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 1.5rem 0 3rem;
    }

    header.top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--line);
      flex-wrap: wrap;
    }

    .brand {
      font-family: var(--font-display);
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--ink);
      text-decoration: none;
      white-space: nowrap;
    }
    .brand span { color: var(--accent); }

    nav.tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
    }

    nav.tabs button {
      font: inherit;
      font-weight: 650;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
      border-radius: 999px;
      padding: 0.45rem 0.95rem;
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease, transform 0.12s ease;
    }

    nav.tabs button.active {
      border-color: transparent;
      background: var(--accent);
      color: var(--accent-ink);
    }

    .panel {
      background: var(--bg-elevated);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 1.1rem 1.2rem;
      box-shadow: var(--shadow);
    }

    h1 {
      font-family: var(--font-display);
      font-size: clamp(1.7rem, 4vw, 2.3rem);
      margin: 0 0 0.4rem;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .lede { color: var(--muted); margin: 0 0 1.2rem; }

    .stack { display: grid; gap: 0.95rem; }
    .field label { display: block; font-size: 0.9rem; font-weight: 650; margin-bottom: 0.35rem; }
    .field input, .field textarea {
      width: 100%;
      font: inherit;
      padding: 0.7rem 0.85rem;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--ink);
      outline: none;
    }
    .field textarea { min-height: 6.5rem; resize: vertical; }

    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.95rem; }
    @media (max-width: 720px) { .row2 { grid-template-columns: 1fr; } }
    .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.95rem; }
    @media (max-width: 900px) { .row3 { grid-template-columns: 1fr; } }

    .btn {
      font: inherit;
      font-weight: 700;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--ink);
      border-radius: 12px;
      padding: 0.75rem 1rem;
      cursor: pointer;
      transition: transform 0.12s ease, border-color 0.15s ease, background 0.15s ease;
    }
    .btn:hover { transform: translateY(-1px); border-color: rgba(212,162,127,0.55); }
    .btn-primary {
      background: var(--accent);
      border-color: transparent;
      color: var(--accent-ink);
    }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }

    .message {
      margin-top: 1rem;
      padding: 0.75rem 0.9rem;
      border-radius: 10px;
      display: none;
      font-size: 0.95rem;
    }
    .message.show { display: block; }
    .message.ok { background: color-mix(in srgb, var(--ok) 14%, transparent); color: var(--ok); }
    .message.err { background: color-mix(in srgb, var(--bad) 14%, transparent); color: var(--bad); }
    .message.info { background: color-mix(in srgb, var(--pending) 14%, transparent); color: var(--pending); }

    .pill {
      display: inline-flex;
      align-items: center;
      padding: 0.15rem 0.55rem;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }
    .pill.pending { background: color-mix(in srgb, var(--pending) 18%, transparent); color: var(--pending); }
    .pill.confirmed { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
    .pill.approved { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
    .pill.rejected { background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad); }

    .status-card dl {
      display: grid;
      grid-template-columns: 10rem 1fr;
      gap: 0.55rem 0.75rem;
      margin: 0;
    }
    .status-card dt { color: var(--muted); }
    .status-card dd { margin: 0; overflow-wrap: anywhere; }
    .hint { color: var(--muted); font-size: 0.84rem; }
    .app-list { display: grid; gap: 0.8rem; }
    .app-card { border: 1px solid var(--line); border-radius: 12px; padding: 0.9rem; }
    .app-card-head { display:flex; justify-content:space-between; gap:0.8rem; align-items:flex-start; }
    .app-card-title { font-size: 1.05rem; font-weight: 700; margin: 0; }
    .app-actions { display:flex; gap:0.5rem; flex-wrap:wrap; margin-top:0.8rem; }
    .filters { display:flex; flex-wrap:wrap; gap:0.4rem; margin-bottom:1rem; }
    .filters button { font:inherit; border:1px solid var(--line); background:transparent; color:var(--muted); border-radius:999px; padding:0.35rem 0.75rem; cursor:pointer; }
    .filters button.active { background: color-mix(in srgb, var(--accent) 16%, transparent); border-color: rgba(212,162,127,0.55); color: var(--ink); }
    .muted-box { margin-top:0.8rem; padding:0.75rem 0.9rem; border-radius:10px; background:rgba(255,255,255,0.02); color:var(--muted); }

    @media (max-width: 640px) {
      .status-card dl { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div class="shell">
  <header class="top">
    <a class="brand" href="#apply">Квазар <span>Заявки</span></a>
    <nav class="tabs" aria-label="Шаги">
      <button type="button" data-route="apply">Подать</button>
      <button type="button" data-route="verify" disabled>Подтвердить</button>
      <button type="button" data-route="status" disabled>Статус</button>
      <button type="button" data-route="admin">Админ</button>
    </nav>
  </header>

  <main id="view"></main>

  <div id="message" class="message" role="status" aria-live="polite"></div>
</div>

<script>
  (function () {
    function resolveApiBase() {
      if (window.QUAZAR_API_BASE) return String(window.QUAZAR_API_BASE).replace(/\/$/, "");
      const host = location.hostname;
      if (host === "localhost" || host === "127.0.0.1") return "http://127.0.0.1:8080";
      if (host === "quazar.website" || host === "www.quazar.website") return location.origin;
      return "https://api.quazar.website";
    }

    const API_BASE = resolveApiBase();
    const MSG = document.getElementById("message");
    const VIEW = document.getElementById("view");

    const SESSION_ID_KEY = "quazar_app_id";
    const SUBMIT_RATE_KEY = "quazar_app_last_submit";
    const ADMIN_KEY = "quazar_admin_api_key";

    function showMessage(text, type) {
      MSG.textContent = text;
      MSG.className = "message show " + (type || "info");
    }
    function clearMessage() {
      MSG.className = "message";
      MSG.textContent = "";
    }

    function pill(status) {
      return '<span class="pill ' + status + '">' + status + "</span>";
    }

    function escapeHtml(s) {
      return String(s ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function formatDate(iso) {
      try {
        return new Date(iso).toLocaleString("ru-RU", { dateStyle: "medium", timeStyle: "short" });
      } catch (_) {
        return iso;
      }
    }

    function canSubmitClient() {
      const last = Number(localStorage.getItem(SUBMIT_RATE_KEY) || 0);
      return Date.now() - last >= 60 * 1000;
    }
    function markSubmitted() {
      localStorage.setItem(SUBMIT_RATE_KEY, String(Date.now()));
    }

    async function api(path, options) {
      const res = await fetch(API_BASE + path, options);
      let body = null;
      try { body = await res.json(); } catch (_) {}
      if (!res.ok) {
        const err = (body && (body.error || body.message)) || ("HTTP " + res.status);
        throw new Error(err);
      }
      return body;
    }

    function authHeaders(json) {
      const key = sessionStorage.getItem(ADMIN_KEY) || "";
      const headers = { "Accept": "application/json" };
      if (json) headers["Content-Type"] = "application/json";
      if (key) headers["Authorization"] = "Bearer " + key;
      return headers;
    }

    function parseHash() {
      const raw = (location.hash || "#apply").replace(/^#/, "");
      const parts = raw.split("/").filter(Boolean);
      if (!parts.length) return { route: "apply" };
      if (parts[0] === "apply") return { route: "apply" };
      if (parts[0] === "verify") return { route: "verify", id: parts[1] || "" };
      if (parts[0] === "status") return { route: "status", id: parts[1] || "" };
      if (parts[0] === "admin") return { route: "admin" };
      return { route: "apply" };
    }

    function setRoute(route, id) {
      if (route === "apply") location.hash = "apply";
      if (route === "verify") location.hash = "verify/" + encodeURIComponent(id);
      if (route === "status") location.hash = "status/" + encodeURIComponent(id);
      if (route === "admin") location.hash = "admin";
    }

    function syncTabs(state) {
      const tabs = document.querySelectorAll("nav.tabs button");
      tabs.forEach(btn => {
        const route = btn.dataset.route;
        if (route === state.route) btn.classList.add("active");
        else btn.classList.remove("active");
        if (route === "verify") btn.disabled = !(state.id || sessionStorage.getItem(SESSION_ID_KEY));
        if (route === "status") btn.disabled = !(state.id || sessionStorage.getItem(SESSION_ID_KEY));
      });
    }

    function renderApply() {
      VIEW.innerHTML = ""
        + "<h1>Подача заявки на гражданство</h1>"
        + '<p class="lede">Заполните форму, затем подтвердите email кодом из письма.</p>'
        + '<div class="panel">'
        + '  <form class="stack" id="apply-form" novalidate>'
        + '    <div class="row2">'
        + '      <div class="field"><label>Логин</label><input id="login" required maxlength="13" pattern="[A-Za-z]{1,13}" title="Только латиница (A–Z, a–z), 1–13 символов" placeholder="например: ivan" autocomplete="username"></div>'
        + '      <div class="field"><label>email</label><input id="email" required maxlength="254" type="email" placeholder="you@example.com"></div>'
        + '    </div>'
        + '    <div class="hint" style="color:#9aa3b5;font-size:0.84rem;margin-top:-0.35rem;">Логин: только латиница (A–Z, a–z), без цифр и спецсимволов, 1–13 символов. Регистр не важен.</div>'
        + '    <div class="field"><label>ФИО</label><input id="full_name" required maxlength="200" placeholder="Иван Иванов"></div>'
        + '    <div class="field"><label>Данные паспорта</label><textarea id="passport_data" required maxlength="2000" placeholder="Серия/номер, кем выдан, дата"></textarea></div>'
        + '    <div class="field"><label>Причина</label><textarea id="reason" required maxlength="5000" placeholder="Коротко: зачем вам гражданство Квазара"></textarea></div>'
        + '    <button class="btn btn-primary" type="submit" id="submitBtn">Отправить заявку</button>'
        + '    <div class="hint" style="color:#9aa3b5;font-size:0.84rem;margin-top:0.25rem;">Не более 1 заявки в месяц на один email.</div>'
        + '  </form>'
        + "</div>";

      document.getElementById("apply-form").addEventListener("submit", onSubmit);
    }

    async function onSubmit(e) {
      e.preventDefault();
      clearMessage();

      if (!canSubmitClient()) {
        showMessage("Слишком часто. Подождите минуту.", "err");
        return;
      }

      const login = document.getElementById("login").value.trim();
      const email = document.getElementById("email").value.trim();
      const full_name = document.getElementById("full_name").value.trim();
      const passport_data = document.getElementById("passport_data").value.trim();
      const reason = document.getElementById("reason").value.trim();

      if (!login || !email || !full_name || !passport_data || !reason) {
        showMessage("Заполните все поля.", "err");
        return;
      }

      const loginNorm = login.toLowerCase();
      if (loginNorm.length < 1 || loginNorm.length > 13) {
        showMessage("Логин должен быть от 1 до 13 символов.", "err");
        return;
      }
      if (!/^[a-z]+$/.test(loginNorm)) {
        showMessage("Логин: только латинские буквы (A–Z, a–z), без цифр и спецсимволов.", "err");
        return;
      }
      if (loginNorm === "successful") {
        showMessage("Имя Successful зарезервировано за основателем.", "err");
        return;
      }

      const btn = document.getElementById("submitBtn");
      btn.disabled = true;

      try {
        const payload = { login: loginNorm, full_name, passport_data, email, reason };
        const res = await api("/api/application", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        markSubmitted();
        const id = (res.data && res.data.id) ? res.data.id : "";
        if (!id) throw new Error("Не удалось получить ID заявки");

        sessionStorage.setItem(SESSION_ID_KEY, id);
        showMessage("Заявка принята. Код подтверждения отправлен на email.", "ok");
        setRoute("verify", id);
      } catch (err) {
        showMessage(err.message || String(err), "err");
      } finally {
        btn.disabled = false;
      }
    }

    function renderVerify(state) {
      const id = state.id || sessionStorage.getItem(SESSION_ID_KEY) || "";
      if (!id) {
        VIEW.innerHTML = ""
          + "<h1>Подтверждение кода</h1>"
          + '<div class="panel"><p class="lede">Сначала отправьте заявку.</p>'
          + '<button class="btn btn-primary" type="button" onclick="location.hash=\'apply\'">К форме</button>'
          + "</div>";
        return;
      }

      VIEW.innerHTML = ""
        + "<h1>Подтверждение email</h1>"
        + '<p class="lede">Введите 6-значный код из письма.</p>'
        + '<div class="panel">'
        + '  <form class="stack" id="verify-form" novalidate>'
        + '    <div class="field">'
        + '      <label>Код (6 цифр)</label>'
        + '      <input id="code" required inputmode="numeric" maxlength="6" placeholder="123456">'
        + '    </div>'
        + '    <div class="field" style="margin-top:-0.25rem;">'
        + '      <div class="hint" style="color:#9aa3b5;font-size:0.84rem;">ID заявки: <code>' + escapeHtml(id) + '</code></div>'
        + '    </div>'
        + '    <button class="btn btn-primary" type="submit" id="verifyBtn">Подтвердить</button>'
        + '  </form>'
        + "</div>";

      document.getElementById("verify-form").addEventListener("submit", async function (e) {
        e.preventDefault();
        clearMessage();

        const code = document.getElementById("code").value.trim();
        if (!code || !/^\d{6}$/.test(code)) {
          showMessage("Введите код из 6 цифр.", "err");
          return;
        }

        const btn = document.getElementById("verifyBtn");
        btn.disabled = true;

        try {
          const res = await api("/api/application/verify", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ id: id, code: code })
          });

          showMessage("Код подтверждён. Обновляем статус…", "ok");
          setRoute("status", id);
        } catch (err) {
          showMessage(err.message || String(err), "err");
        } finally {
          btn.disabled = false;
        }
      });
    }

    async function loadStatus(id) {
      const resPanel = document.getElementById("statusOut");
      if (!resPanel) return;
      clearMessage();
      resPanel.innerHTML = "<p class='lede'>Загрузка…</p>";

      try {
        const res = await api("/api/application/" + encodeURIComponent(id), {
          method: "GET",
          headers: { "Accept": "application/json" }
        });
        const a = res.data;
        resPanel.innerHTML = ""
          + "<h2 style='font-family:var(--font-display);margin:0 0 0.6rem;font-size:1.6rem;'>" + escapeHtml(a.full_name) + "</h2>"
          + pill(a.status)
          + "<dl style='margin-top:1rem;'>"
          + "<dt>ID</dt><dd><code>" + escapeHtml(a.id) + "</code></dd>"
          + "<dt>Логин</dt><dd>" + escapeHtml(a.login) + "</dd>"
          + "<dt>Citizen ID</dt><dd>" + escapeHtml(a.citizen_id || "—") + "</dd>"
          + "<dt>Создана</dt><dd>" + escapeHtml(formatDate(a.created_at)) + "</dd>"
          + "<dt>Обновлена</dt><dd>" + escapeHtml(formatDate(a.updated_at)) + "</dd>"
          + "<dt>Подтверждена</dt><dd>" + (a.confirmed_at ? escapeHtml(formatDate(a.confirmed_at)) : "—") + "</dd>"
          + "<dt>Решение</dt><dd>" + (a.reviewed_at ? escapeHtml(formatDate(a.reviewed_at)) : "—") + "</dd>"
          + "<dt>Кем проверена</dt><dd>" + escapeHtml(a.reviewed_by || "—") + "</dd>"
          + "<dt>Комментарий</dt><dd>" + escapeHtml(a.review_note || "—") + "</dd>"
          + "</dl>";
      } catch (err) {
        resPanel.innerHTML = "<p class='lede'>" + escapeHtml(err.message || String(err)) + "</p>";
      }
    }

    function renderStatus(state) {
      const id = state.id || sessionStorage.getItem(SESSION_ID_KEY) || "";
      if (!id) {
        VIEW.innerHTML = ""
          + "<h1>Статус заявки</h1>"
          + '<div class="panel"><p class="lede">Сначала отправьте заявку.</p></div>';
        return;
      }

      VIEW.innerHTML = ""
        + "<h1>Статус заявки</h1>"
        + '<p class="lede">Отслеживайте изменения после подтверждения email.</p>'
        + '<div class="panel status-card" id="statusOut"></div>';

      loadStatus(id);
    }

    async function adminAction(id, action, note) {
      return api("/api/application/" + encodeURIComponent(id) + "/" + action, {
        method: "POST",
        headers: authHeaders(true),
        body: JSON.stringify({ note: note || null })
      });
    }

    async function renderAdmin() {
      VIEW.innerHTML = ""
        + "<h1>Модерация заявок</h1>"
        + '<p class="lede">Доступно для Aiya / Founder по API-ключу.</p>'
        + '<div class="panel" style="margin-bottom:1rem;">'
        + '  <div class="stack">'
        + '    <div class="field"><label>API-ключ администратора</label><input id="adminKey" type="password" placeholder="Bearer key" autocomplete="off"></div>'
        + '    <div><button class="btn btn-primary" id="saveAdminKey" type="button">Сохранить ключ</button></div>'
        + '  </div>'
        + '</div>'
        + '<div class="filters">'
        + '  <button type="button" data-filter="all" class="active">Все</button>'
        + '  <button type="button" data-filter="pending">pending</button>'
        + '  <button type="button" data-filter="confirmed">confirmed</button>'
        + '  <button type="button" data-filter="approved">approved</button>'
        + '  <button type="button" data-filter="rejected">rejected</button>'
        + '</div>'
        + '<div class="panel"><div id="adminList" class="app-list"><p class="lede">Сначала сохраните ключ.</p></div></div>';

      document.getElementById("adminKey").value = sessionStorage.getItem(ADMIN_KEY) || "";
      document.getElementById("saveAdminKey").addEventListener("click", function () {
        const key = document.getElementById("adminKey").value.trim();
        if (key) {
          sessionStorage.setItem(ADMIN_KEY, key);
          showMessage("Админ-ключ сохранён в sessionStorage.", "ok");
          loadAdminList("all");
        } else {
          sessionStorage.removeItem(ADMIN_KEY);
          showMessage("Админ-ключ очищен.", "info");
          document.getElementById("adminList").innerHTML = "<p class='lede'>Сначала сохраните ключ.</p>";
        }
      });

      document.querySelectorAll("[data-filter]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          document.querySelectorAll("[data-filter]").forEach(function (x) { x.classList.remove("active"); });
          btn.classList.add("active");
          loadAdminList(btn.dataset.filter);
        });
      });

      if (sessionStorage.getItem(ADMIN_KEY)) {
        loadAdminList("all");
      }
    }

    async function loadAdminList(filter) {
      const out = document.getElementById("adminList");
      if (!out) return;
      if (!sessionStorage.getItem(ADMIN_KEY)) {
        out.innerHTML = "<p class='lede'>Сначала сохраните ключ.</p>";
        return;
      }
      out.innerHTML = "<p class='lede'>Загрузка…</p>";
      try {
        const qs = filter && filter !== "all" ? ("?status=" + encodeURIComponent(filter)) : "";
        const res = await api("/api/applications" + qs, {
          method: "GET",
          headers: authHeaders(false)
        });
        const items = (res.data && res.data.applications) || [];
        if (!items.length) {
          out.innerHTML = "<p class='lede'>Заявок нет.</p>";
          return;
        }
        out.innerHTML = items.map(function (a) {
          const canApprove = a.status === "confirmed";
          const canReject = a.status === "pending" || a.status === "confirmed";
          return ""
            + '<div class="app-card" data-id="' + escapeHtml(a.id) + '">'
            + '  <div class="app-card-head">'
            + '    <div>'
            + '      <p class="app-card-title">' + escapeHtml(a.full_name) + ' <span class="hint">(@' + escapeHtml(a.login) + ')</span></p>'
            + '      <div class="hint">' + escapeHtml(a.email) + ' · ' + escapeHtml(formatDate(a.created_at)) + '</div>'
            + (a.citizen_id ? '      <div class="hint">citizen_id: <code>' + escapeHtml(a.citizen_id) + '</code></div>' : '')
            + '    </div>'
            +      pill(a.status)
            + '  </div>'
            + '  <div class="muted-box"><strong>Причина:</strong> ' + escapeHtml(a.reason) + '</div>'
            + '  <div class="muted-box"><strong>Комментарий:</strong> ' + escapeHtml(a.review_note || "—") + '</div>'
            + '  <div class="field" style="margin-top:0.8rem;"><label>Комментарий модератора</label><textarea class="review-note" placeholder="Причина отклонения или служебная заметка"></textarea></div>'
            + '  <div class="app-actions">'
            + '    <button type="button" class="btn btn-primary do-approve"' + (canApprove ? "" : " disabled") + '>Approve</button>'
            + '    <button type="button" class="btn do-reject"' + (canReject ? "" : " disabled") + '>Reject</button>'
            + '    <button type="button" class="btn do-open-status">Открыть статус</button>'
            + '  </div>'
            + '</div>';
        }).join("");

        out.querySelectorAll(".app-card").forEach(function (card) {
          const id = card.dataset.id;
          const noteEl = card.querySelector(".review-note");
          const approveBtn = card.querySelector(".do-approve");
          const rejectBtn = card.querySelector(".do-reject");
          const openBtn = card.querySelector(".do-open-status");

          if (approveBtn) approveBtn.addEventListener("click", async function () {
            approveBtn.disabled = true;
            rejectBtn.disabled = true;
            try {
              await adminAction(id, "approve", noteEl.value.trim());
              showMessage("Заявка одобрена.", "ok");
              loadAdminList(filter);
            } catch (err) {
              showMessage(err.message || String(err), "err");
              approveBtn.disabled = false;
              rejectBtn.disabled = false;
            }
          });

          if (rejectBtn) rejectBtn.addEventListener("click", async function () {
            rejectBtn.disabled = true;
            approveBtn.disabled = true;
            try {
              await adminAction(id, "reject", noteEl.value.trim());
              showMessage("Заявка отклонена.", "ok");
              loadAdminList(filter);
            } catch (err) {
              showMessage(err.message || String(err), "err");
              rejectBtn.disabled = false;
              approveBtn.disabled = false;
            }
          });

          if (openBtn) openBtn.addEventListener("click", function () {
            sessionStorage.setItem(SESSION_ID_KEY, id);
            setRoute("status", id);
          });
        });
      } catch (err) {
        out.innerHTML = "<p class='lede'>" + escapeHtml(err.message || String(err)) + "</p>";
      }
    }

    function render() {
      const state = parseHash();
      const id = state.id || sessionStorage.getItem(SESSION_ID_KEY) || "";
      state.id = id;

      // Update tabs
      syncTabs(state);

      clearMessage();
      if (state.route === "apply") return renderApply();
      if (state.route === "verify") return renderVerify(state);
      if (state.route === "status") return renderStatus(state);
      if (state.route === "admin") return renderAdmin();
      renderApply();
    }

    document.querySelectorAll("nav.tabs button").forEach(function (btn) {
      btn.addEventListener("click", function () {
        const route = btn.dataset.route;
        const id = sessionStorage.getItem(SESSION_ID_KEY) || "";
        if (route === "apply") return setRoute("apply");
        if (route === "verify" && id) return setRoute("verify", id);
        if (route === "status" && id) return setRoute("status", id);
        if (route === "admin") return setRoute("admin");
      });
    });

    window.addEventListener("hashchange", render);
    render();

    // Expose a couple of helpers for inline button handlers
    window.setRoute = setRoute;
  })();
</script>
</body>
</html>
