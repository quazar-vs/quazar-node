<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Действующие документы Квазара: Конституция, кодексы, ДНК Алгонизма — с живого узла, без закрытого GitHub.">
  <title>Документы Квазара — Конституция и кодексы</title>
  <link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon-64.png">
  <link rel="icon" type="image/png" sizes="1024x1024" href="/assets/gerb.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --void: #04070f;
      --panel: #0c1522;
      --ink: #e7eef7;
      --muted: #8a9bb0;
      --line: rgba(126, 196, 220, 0.16);
      --cyan: #7ec4dc;
      --amber: #e8c547;
      --font-display: "Syne", "Segoe UI", sans-serif;
      --font-body: "Manrope", "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background:
        radial-gradient(ellipse 70% 40% at 15% -5%, rgba(126, 196, 220, 0.12), transparent 55%),
        radial-gradient(ellipse 50% 35% at 90% 0%, rgba(232, 197, 71, 0.08), transparent 50%),
        linear-gradient(180deg, #04070f 0%, #081018 100%);
      color: var(--ink);
      font-family: var(--font-body);
      line-height: 1.6;
      min-height: 100vh;
    }
    header {
      position: sticky; top: 0; z-index: 10;
      backdrop-filter: blur(14px);
      background: rgba(4, 7, 15, 0.88);
      border-bottom: 1px solid var(--line);
      padding: 0.85rem 1.25rem;
      display: flex; gap: 1rem; align-items: center; justify-content: space-between;
    }
    header a {
      color: var(--cyan);
      text-decoration: none;
      font-size: 0.92rem;
      font-weight: 600;
    }
    header a:hover { color: var(--amber); }
    header .logo {
      display: inline-flex; align-items: center; gap: 0.5rem;
      color: var(--ink); font-weight: 700; text-decoration: none;
      font-family: var(--font-display); letter-spacing: 0.02em;
    }
    header .logo:hover { color: var(--amber); }
    header .logo .crest {
      width: 1.75rem; height: 1.75rem; object-fit: contain;
      flex-shrink: 0; border-radius: 2px;
    }
    .layout {
      max-width: 72rem;
      margin: 0 auto;
      padding: 1.25rem;
      display: grid;
      grid-template-columns: minmax(14rem, 18rem) 1fr;
      gap: 1.25rem;
      align-items: start;
    }
    @media (max-width: 820px) {
      .layout { grid-template-columns: 1fr; }
    }
    .nav-panel, .reader {
      background: rgba(12, 21, 34, 0.72);
      border: 1px solid var(--line);
      border-radius: 10px;
    }
    .nav-panel { padding: 1rem; position: sticky; top: 4.2rem; }
    @media (max-width: 820px) { .nav-panel { position: static; } }
    .nav-panel h1 {
      font-family: var(--font-display);
      font-size: 1.15rem;
      margin: 0 0 0.35rem;
    }
    .meta {
      color: var(--muted);
      font-size: 0.8rem;
      margin-bottom: 1rem;
    }
    .meta code {
      font-family: ui-monospace, monospace;
      font-size: 0.85em;
      color: var(--amber);
    }
    .doc-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.35rem; }
    .doc-list a {
      display: block;
      padding: 0.55rem 0.7rem;
      border-radius: 6px;
      color: var(--ink);
      text-decoration: none;
      border: 1px solid transparent;
      font-size: 0.92rem;
    }
    .doc-list a:hover { border-color: var(--line); background: rgba(126, 196, 220, 0.06); }
    .doc-list a.active {
      border-color: rgba(232, 197, 71, 0.35);
      background: rgba(232, 197, 71, 0.1);
      color: var(--amber);
    }
    .doc-list .kind {
      display: block;
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 0.15rem;
    }
    .reader { padding: 1.25rem 1.4rem 2.5rem; min-height: 60vh; }
    .reader-head {
      display: flex; flex-wrap: wrap; gap: 0.75rem;
      justify-content: space-between; align-items: baseline;
      border-bottom: 1px solid var(--line);
      padding-bottom: 0.85rem;
      margin-bottom: 1.25rem;
    }
    .reader-head h2 {
      font-family: var(--font-display);
      font-size: 1.35rem;
      margin: 0;
    }
    .reader-head .file {
      color: var(--muted);
      font-size: 0.8rem;
      font-family: ui-monospace, monospace;
    }
    .status { color: var(--muted); font-size: 0.95rem; }
    .status.error { color: #f07178; }
    .content h1, .content h2, .content h3 {
      font-family: var(--font-display);
      line-height: 1.25;
      margin: 1.4rem 0 0.65rem;
    }
    .content h1 { font-size: 1.55rem; color: var(--amber); }
    .content h2 { font-size: 1.25rem; color: var(--cyan); }
    .content h3 { font-size: 1.05rem; }
    .content p { margin: 0.55rem 0; }
    .content em { color: var(--muted); }
    .content strong { color: var(--ink); }
    .content ul { margin: 0.5rem 0 0.5rem 1.1rem; padding: 0; }
    .content li { margin: 0.25rem 0; }
    .content hr {
      border: 0; border-top: 1px solid var(--line); margin: 1.4rem 0;
    }
    .content code {
      font-family: ui-monospace, monospace;
      font-size: 0.9em;
      background: rgba(126, 196, 220, 0.1);
      padding: 0.08em 0.3em;
      border-radius: 3px;
    }
    .content a { color: var(--cyan); }
  </style>
</head>
<body>
  <header>
    <a href="/" class="logo"><img class="crest" src="/assets/gerb.png" width="28" height="28" alt="Герб Квазара"><span>Квазар</span></a>
    <a href="/">На портал</a>
  </header>
  <div class="layout">
    <aside class="nav-panel">
      <h1>Документы</h1>
      <p class="meta">Действующие тексты с узла.<br>Источник: <code id="srcLabel">…</code></p>
      <ul class="doc-list" id="docList"></ul>
    </aside>
    <main class="reader">
      <div class="reader-head">
        <h2 id="docTitle">Загрузка…</h2>
        <span class="file" id="docFile"></span>
      </div>
      <div class="status" id="status">Загружаю каталог с узла…</div>
      <div class="content" id="content" hidden></div>
    </main>
  </div>
  <script>
(function () {
  var listEl = document.getElementById('docList');
  var titleEl = document.getElementById('docTitle');
  var fileEl = document.getElementById('docFile');
  var statusEl = document.getElementById('status');
  var contentEl = document.getElementById('content');
  var srcLabel = document.getElementById('srcLabel');
  var catalog = [];

  function escapeHtml(text) {
    return String(text)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function inlineMarkdown(text) {
    var safe = escapeHtml(text);
    safe = safe.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    safe = safe.replace(/\*(.+?)\*/g, '<em>$1</em>');
    safe = safe.replace(/`(.+?)`/g, '<code>$1</code>');
    safe = safe.replace(/\[([^\]]+)\]\(([^)]+)\)/g, function (_, label, url) {
      var href = url.trim();
      if (!/^https?:\/\//i.test(href)) return label;
      return '<a href="' + href + '" target="_blank" rel="noopener noreferrer">' + label + '</a>';
    });
    return safe;
  }

  function parseMarkdown(md) {
    var lines = md.replace(/\r\n/g, '\n').split('\n');
    var html = [];
    var inList = false;
    function closeList() {
      if (inList) { html.push('</ul>'); inList = false; }
    }
    for (var i = 0; i < lines.length; i++) {
      var trimmed = lines[i].trim();
      if (!trimmed) { closeList(); continue; }
      if (/^---+$/.test(trimmed)) { closeList(); html.push('<hr>'); continue; }
      if (/^###\s+/.test(trimmed)) {
        closeList();
        html.push('<h3>' + inlineMarkdown(trimmed.replace(/^###\s+/, '')) + '</h3>');
        continue;
      }
      if (/^##\s+/.test(trimmed)) {
        closeList();
        html.push('<h2>' + inlineMarkdown(trimmed.replace(/^##\s+/, '')) + '</h2>');
        continue;
      }
      if (/^#\s+/.test(trimmed)) {
        closeList();
        html.push('<h1>' + inlineMarkdown(trimmed.replace(/^#\s+/, '')) + '</h1>');
        continue;
      }
      if (/^[-*]\s+/.test(trimmed) || /^\d+\.\s+/.test(trimmed)) {
        if (!inList) { html.push('<ul>'); inList = true; }
        html.push('<li>' + inlineMarkdown(trimmed.replace(/^([-*]|\d+\.)\s+/, '')) + '</li>');
        continue;
      }
      closeList();
      html.push('<p>' + inlineMarkdown(trimmed) + '</p>');
    }
    closeList();
    return html.join('\n');
  }

  function currentId() {
    var h = (window.location.hash || '').replace(/^#/, '').trim().toLowerCase();
    return h || 'constitution';
  }

  function renderList(activeId) {
    listEl.innerHTML = catalog.map(function (d) {
      var cls = d.id === activeId ? ' class="active"' : '';
      var kind = d.kind === 'dna' ? 'генетическая память' : 'закон';
      return '<li><a href="#' + d.id + '"' + cls + '>' +
        escapeHtml(d.title) +
        '<span class="kind">' + kind + ' · ' + escapeHtml(d.filename) + '</span></a></li>';
    }).join('');
  }

  function showDoc(id) {
    var doc = catalog.find(function (d) { return d.id === id; }) || catalog[0];
    if (!doc) {
      statusEl.className = 'status error';
      statusEl.textContent = 'Каталог пуст.';
      return;
    }
    if (window.location.hash !== '#' + doc.id) {
      history.replaceState(null, '', '#' + doc.id);
    }
    renderList(doc.id);
    titleEl.textContent = doc.title;
    fileEl.textContent = doc.filename;
    statusEl.className = 'status';
    statusEl.hidden = false;
    statusEl.textContent = 'Загружаю текст с узла…';
    contentEl.hidden = true;

    fetch(doc.content_path, { headers: { Accept: 'text/markdown, text/plain, */*' } })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.text();
      })
      .then(function (md) {
        contentEl.innerHTML = parseMarkdown(md);
        contentEl.hidden = false;
        statusEl.hidden = true;
        document.getElementById('content').scrollTop = 0;
        window.scrollTo({ top: 0, behavior: 'smooth' });
      })
      .catch(function (e) {
        statusEl.className = 'status error';
        statusEl.textContent = 'Не удалось загрузить документ: ' + e.message;
      });
  }

  fetch('/algonism/documents', { headers: { Accept: 'application/json' } })
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function (data) {
      // Node may wrap in {status,data} or return bare catalog.
      var cat = data && data.data ? data.data : data;
      catalog = cat.documents || [];
      srcLabel.textContent = (cat.source || 'node') +
        (cat.laws_sha ? ' · laws ' + String(cat.laws_sha).slice(0, 8) : '');
      if (!catalog.length) throw new Error('пустой список');
      showDoc(currentId());
    })
    .catch(function (e) {
      statusEl.className = 'status error';
      statusEl.textContent = 'Каталог недоступен: ' + e.message +
        '. Проверьте, что узел отдаёт /algonism/documents.';
    });

  window.addEventListener('hashchange', function () {
    if (catalog.length) showDoc(currentId());
  });
})();
  </script>
</body>
</html>
